name: CI

on:
  push:
  pull_request:

# read-only: the tests need nothing else (this also runs on pull requests in the public repository)
permissions:
  contents: read

jobs:
  test:
    # Playwright 1.56 supports Ubuntu up to 24.04 (ubuntu-latest is 26.04 now)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e
